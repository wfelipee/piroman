<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piroman Steak House – Sopot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#3a0f12;--bg2:#2c0a0d;--text:#f2e8dc;--muted:#c9b4a3;--flame:#f0a43a;--line:rgba(242,232,220,.22);
--display:'Alfa Slab One',Georgia,serif;--body:'Work Sans',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.0625rem/1.65 var(--body)}
a{color:inherit}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.5rem}
a:focus-visible,button:focus-visible{outline:3px solid var(--flame);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0}
header .logo{font-family:var(--display);font-size:1.15rem;text-decoration:none}
nav a{margin-left:1.4rem;text-decoration:none;color:var(--muted);font-weight:500}
nav a:hover{color:var(--flame)}
.hero{padding:4.5rem 0 5rem;border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(3.4rem,13vw,9rem);line-height:.92;margin:0 0 1.5rem;letter-spacing:-.01em;color:var(--flame)}
.hero p{max-width:34rem;font-size:1.25rem;margin:0 0 2rem}
.btns{display:flex;flex-wrap:wrap;gap:.9rem}
.btn{display:inline-block;padding:.85rem 1.6rem;border-radius:2px;font-weight:600;text-decoration:none;border:2px solid var(--flame)}
.btn.primary{background:var(--flame);color:var(--bg2)}
.btn.primary:hover{background:var(--text);border-color:var(--text)}
.btn.ghost:hover{background:var(--flame);color:var(--bg2)}
section{padding:4.5rem 0;border-bottom:1px solid var(--line)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(2rem,6vw,3.2rem);margin:0 0 1.5rem;line-height:1.05}
.about{max-width:38rem}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:2.5rem}
.menu-cat h3{font-size:1.2rem;margin:0 0 1rem;color:var(--flame);font-weight:600}
.item{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-bottom:1px dotted var(--line)}
.item b{font-weight:600}.item small{display:block;color:var(--muted)}
.item .price{white-space:nowrap;font-weight:600}
.placeholder{border:2px dashed var(--line);padding:2.5rem 1.5rem;color:var(--muted);max-width:38rem}
.placeholder strong{color:var(--text);display:block;font-size:1.2rem;margin-bottom:.4rem}
.visit{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:3rem}
table{width:100%;border-collapse:collapse}
td{padding:.55rem 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
tr.today{color:var(--flame);font-weight:600}
.status{margin:0 0 1rem;font-weight:600}
.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;background:var(--muted);margin-right:.5rem}
.status.open .dot{background:#7bd88f}.status.closed .dot{background:#e0685e}
.visit p{margin:0 0 1rem}
.tel{font-family:var(--display);font-size:1.8rem;text-decoration:none;color:var(--flame)}
footer{background:var(--bg2);padding:2rem 0;color:var(--muted);font-size:.95rem}
